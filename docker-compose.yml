version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: airops-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airops}
      POSTGRES_USER: ${POSTGRES_USER:-airops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airops_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airops} -d ${POSTGRES_DB:-airops}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
